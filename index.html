<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (Pyodide)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
        textarea { width: 100%; height: 300px; margin-bottom: 1em; padding: 0.5em; box-sizing: border-box; font-family: monospace; }
        button { padding: 0.5em 2em; font-size: 1em; cursor: pointer; margin-right: 0.5em; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin: 1em 0; color: #555; min-height: 1.2em; }
        .note { font-size: 0.9em; color: #777; margin-top: 2em; border-top: 1px solid #eee; padding-top: 1em; }
        .progress { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin: 0.5em 0; }
        .progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.3s; }
    </style>
</head>
<body>
    <h1>🔒 Анонимизация (Pyodide)</h1>
    
    <div class="btn-group">
        <button id="initBtn">🐍 Загрузить Python</button>
        <button id="runBtn" disabled>Анонимизировать</button>
    </div>
    
    <div id="status">Нажмите "Загрузить Python"</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    
    <textarea id="inputText" disabled placeholder="Введите текст...">Иванов Иван Петрович работает в ООО Яндекс в Москве. Паспорт: 4510 123456, ИНН 7701234567.</textarea>
    
    <div class="note">
        <strong>Как работает:</strong> Pyodide запускает Python в браузере → 
        извлекает ФИО/организации через эвристики + regex → заменяет на маски. 
        Все данные обрабатываются локально.
    </div>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
    
    <script>
        let pyodide = null;
        let ready = false;

        const initBtn = document.getElementById('initBtn');
        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const textarea = document.getElementById('inputText');

        // === Инициализация Pyodide ===
        async function init() {
            initBtn.disabled = true;
            status.textContent = '⏳ Загрузка Pyodide...';
            progressBar.style.width = '10%';

            try {
                // 1. Загружаем Pyodide
                pyodide = await loadPyodide({
                    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/'
                });
                progressBar.style.width = '40%';
                status.textContent = '⏳ Загрузка micropip...';

                // 2. Явно загружаем micropip (обязательно в Pyodide 0.27+)
                await pyodide.loadPackage('micropip');
                progressBar.style.width = '60%';
                status.textContent = '⏳ Импорт модулей...';

                // 3. Импортируем micropip и создаём функцию извлечения
                await pyodide.runPythonAsync(`
                    import micropip
                    import re
                    import json
                    
                    # Словари для эвристики (русские имена/фамилии)
                    FIRST_NAMES = {
                        'иван','петр','александр','михаил','сергей','андрей','алексей','дмитрий','николай','владимир',
                        'мария','анна','екатерина','елена','ольга','татьяна','наталья','светлана','юлия','дарья'
                    }
                    LAST_NAMES = {
                        'иванов','петров','сидоров','смирнов','попов','козлов','новиков','морозов','волков','соловьев',
                        'михайлов','федоров','романов','захаров','яковлев','соколов','васильев','григорьев'
                    }
                    
                    def extract(text):
                        """Извлекает сущности через эвристики + regex"""
                        entities = []
                        
                        # Паттерн для ФИО: 2-3 слова с заглавной буквы
                        fullname_re = re.compile(r'\\b([А-ЯЁ][а-яёё\\-]{2,30}(?:\\s+[А-ЯЁ][а-яёё\\-]{2,30}){1,2})\\b')
                        for m in fullname_re.finditer(text):
                            candidate = m.group(1)
                            words = candidate.lower().replace('ё','е').split()
                            # Эвристика: хотя бы одно слово из словаря
                            if any(w.strip('.,!?:;') in FIRST_NAMES or w.strip('.,!?:;') in LAST_NAMES for w in words):
                                entities.append({'text': candidate, 'type': 'PER', 'start': m.start(), 'end': m.end()})
                        
                        # Паттерн для организаций
                        org_re = re.compile(r'\\b(?:ООО|ЗАО|ОАО|ПАО|ИП|АО)\\s*[«"]?[А-ЯЁ][А-ЯЁа-яёё\\s\\-.,&«»"'\\'#№]{2,60}[»"]?', re.I)
                        for m in org_re.finditer(text):
                            entities.append({'text': m.group(), 'type': 'ORG', 'start': m.start(), 'end': m.end()})
                        
                        return entities
                `);
                
                progressBar.style.width = '100%';
                status.textContent = '✅ Готово!';
                initBtn.textContent = '✅ Загружено';
                initBtn.style.background = '#4caf50';
                textarea.disabled = false;
                runBtn.disabled = false;
                ready = true;
                
            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                initBtn.disabled = false;
                console.error(e);
            }
        }

        // === Анонимизация ===
        async function anonymize() {
            const text = textarea.value.trim();
            if (!text || !ready) return;
            
            runBtn.disabled = true;
            status.textContent = '⏳ Анализ...';
            
            try {
                // 1. Извлекаем сущности через Python
                const entities = await pyodide.runPythonAsync(`extract(${JSON.stringify(text)})`).then(r => r.toJs());
                
                // 2. Добавляем структурированные данные (regex в JS — быстрее)
                const patterns = [
                    { re: /(?:серия\s*)?\d{2}\s*\d{2}\s*(?:номер\s*)?\d{6}/gi, label: 'ПАСПОРТ' },
                    { re: /(?:ИНН\s*:?\s*)?\d{10,12}\b/gi, label: 'ИНН' },
                    { re: /(?:ОГРН[ИП]?\s*:?\s*)?\d{13,15}\b/gi, label: 'ОГРН' },
                    { re: /(?:СНИЛС\s*:?\s*)?(?:\d{3}-\d{3}-\d{3}\s?\d{2}|\d{11})\b/gi, label: 'СНИЛС' },
                    { re: /(?:ул\.|улица|пр-кт|д\.|дом|кв\.|квартира)\s+[А-ЯЁа-яёё\d\s\-\.,«»"'#№]{3,50}/gi, label: 'АДРЕС' }
                ];
                
                for (const p of patterns) {
                    p.re.lastIndex = 0;
                    for (const m of text.matchAll(p.re)) {
                        entities.push({ text: m[0], type: p.label, start: m.index, end: m.index + m[0].length });
                    }
                }
                
                // 3. Сортируем и убираем перекрытия
                entities.sort((a, b) => a.start - b.start);
                const merged = [];
                for (const e of entities) {
                    if (!merged.length || e.start >= merged[merged.length-1].end) {
                        merged.push(e);
                    }
                }
                
                // 4. Заменяем (с конца)
                let result = text;
                const labels = { PER: 'ФИО', ORG: 'ОРГАНИЗАЦИЯ', LOC: 'МЕСТО' };
                merged.reverse().forEach(e => {
                    const label = labels[e.type] || e.type;
                    result = result.slice(0, e.start) + `[${label}]` + result.slice(e.end);
                });
                
                textarea.value = result;
                status.textContent = `✅ Готово! Заменено ${merged.length} сущностей.`;
                
            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                console.error(e);
            } finally {
                runBtn.disabled = false;
            }
        }

        // === Обработчики ===
        initBtn.addEventListener('click', init);
        runBtn.addEventListener('click', anonymize);
    </script>
</body>
</html>
