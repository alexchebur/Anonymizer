<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (оптимизировано для iOS)</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 2em auto; padding: 0 1em; background: #f8f9fa; }
        textarea { width: 100%; height: 200px; padding: 0.8em; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { padding: 0.8em 2em; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; margin: 0.5em 0; }
        button:disabled { background: #94a3b8; }
        #status { margin: 0.5em 0; font-weight: 500; }
        #progress { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: #10b981; transition: width 0.2s; }
        .note { font-size: 0.85em; color: #64748b; margin-top: 1.5em; }
    </style>
</head>
<body>
    <h1>🔒 Анонимизатор текстов</h1>
    <textarea id="inputText" placeholder="Введите текст...">Иванов Иван работает в ООО Яндекс.</textarea>
    <button id="anonymizeBtn" disabled>▶️ Анонимизировать</button>
    <div id="status">Нажмите кнопку для загрузки модели</div>
    <div id="progress"><div id="progress-fill"></div></div>
    <div class="note">
        <strong>Приватность:</strong> Модель загружается один раз (~12 МБ), далее работает оффлайн. 
        Текст обрабатывается в браузере, данные не отправляются на сервер.
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

        // ✅ КРИТИЧЕСКИ ВАЖНО для iOS/CDN:
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        
        // ✅ Правильный путь к jsdelivr-зеркалу моделей:
        env.remoteHost = 'https://cdn.jsdelivr.net/gh/huggingface/transformers.js@main/';
        env.remotePathTemplate = '{model}/resolve/{revision}/{path}';

        const status = document.getElementById('status');
        const progress = document.getElementById('progress-fill');
        const btn = document.getElementById('anonymizeBtn');
        const textarea = document.getElementById('inputText');

        let pipe;

        // Загружаем модель ПО КЛИКУ (требование iOS Safari)
        btn.addEventListener('click', async () => {
            if (!pipe) {
                btn.disabled = true;
                status.textContent = '⏳ Загрузка модели (~12 МБ)...';
                
                try {
                    // ✅ Используем квантованную модель (int8) для iOS
                    pipe = await pipeline(
                        'token-classification',
                        'onnx-community/distilbert-base-multilingual-cased-finetuned-ner-int8',
                        {
                            progress_callback: (e) => {
                                if (e.status === 'download' && e.total) {
                                    const pct = Math.round((e.loaded / e.total) * 100);
                                    status.textContent = `⏳ Загрузка: ${pct}%`;
                                    progress.style.width = `${pct}%`;
                                } else if (e.status === 'ready') {
                                    status.textContent = '✅ Модель загружена!';
                                    progress.style.width = '100%';
                                }
                            }
                        }
                    );
                } catch (err) {
                    console.error(err);
                    status.innerHTML = `❌ Ошибка: ${err.message}<br><small>Попробуйте обновить страницу или проверить соединение</small>`;
                    progress.style.background = '#ef4444';
                    btn.disabled = false;
                    return;
                }
            }

            // --- Обработка текста ---
            const text = textarea.value.trim();
            if (!text) {
                status.textContent = '⚠️ Введите текст';
                btn.disabled = false;
                return;
            }

            status.textContent = '⏳ Анализ...';
            progress.style.width = '0%';
            progress.style.background = '#10b981';

            try {
                // Простая обработка без чанкования (для совместимости с iOS)
                const results = await pipe(text, { aggregation_strategy: 'simple' });
                
                // Фильтрация и замена
                const THRESHOLD = 0.6;
                const labels = { PER: 'ФИО', PERSON: 'ФИО', ORG: 'ОРГАНИЗАЦИЯ', LOC: 'МЕСТО', GPE: 'ЛОКАЦИЯ' };
                
                let result = text;
                let count = 0;
                
                // Сортируем по позиции и заменяем с конца
                const entities = results
                    .filter(e => e.score >= THRESHOLD)
                    .sort((a, b) => a.start - b.start);
                
                // Убираем перекрытия
                const merged = [];
                for (const e of entities) {
                    if (!merged.length || e.start >= merged[merged.length-1].end) {
                        merged.push(e);
                    } else if (e.score > merged[merged.length-1].score) {
                        merged[merged.length-1] = e;
                    }
                }
                
                // Замена с конца
                for (let i = merged.length - 1; i >= 0; i--) {
                    const e = merged[i];
                    const label = labels[e.entity_group] || e.entity_group?.toUpperCase() || 'СУЩНОСТЬ';
                    result = result.slice(0, e.start) + `[${label}]` + result.slice(e.end);
                    count++;
                }
                
                textarea.value = result;
                status.textContent = `✅ Готово! Заменено ${count} сущностей.`;
            } catch (err) {
                console.error(err);
                status.textContent = '❌ Ошибка обработки текста';
                progress.style.background = '#ef4444';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
