<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (NER + Regex)</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --error: #ef4444; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: #0f172a; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        textarea { width: 100%; height: 220px; margin: 1rem 0; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; resize: vertical; background: #f8fafc; font-family: monospace; }
        textarea:disabled { background: #e2e8f0; cursor: not-allowed; }
        .btn-group { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.5rem 0; }
        button { padding: 0.6rem 1rem; font-size: 14px; font-weight: 500; cursor: pointer; border: none; border-radius: 6px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #loadBtn { background: var(--primary); color: white; }
        #runBtn { background: var(--success); color: white; }
        #debugBtn { background: #64748b; color: white; }
        #status { margin: 0.5rem 0; font-weight: 500; min-height: 1.2rem; }
        .progress { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin: 0.5rem 0; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        .progress-bar.success { background: var(--success); }
        .progress-bar.error { background: var(--error); }
        
        /* Панель правил */
        .rules-panel { background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin: 0.5rem 0; font-size: 0.9rem; }
        .rules-panel label { display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 1rem; cursor: pointer; }
        
        .debug { font-size: 0.8rem; color: #475569; margin-top: 0.5rem; font-family: monospace; white-space: pre-wrap; max-height: 250px; overflow-y: auto; display: none; background: #f8fafc; padding: 0.5rem; border-radius: 6px; border: 1px solid #e2e8f0; }
        .debug.show { display: block; }
        .hint { font-size: 0.85rem; color: #64748b; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
        .warning { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 0.8rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 Анонимизация текстов</h1>
        
        <div id="fileWarning" class="warning">
            ⚠️ Откройте через локальный сервер: <code>python -m http.server 8000</code>
        </div>

        <div class="rules-panel" id="rulesPanel">
            <strong>Активные правила:</strong><br>
            <label><input type="checkbox" checked data-rule="ner"> 🧠 Нейросеть (ФИО, организации, города)</label>
            <label><input type="checkbox" checked data-rule="passport"> 📄 Паспорт</label>
            <label><input type="checkbox" checked data-rule="inn"> 🔢 ИНН</label>
            <label><input type="checkbox" checked data-rule="ogrn"> 🏢 ОГРН/ОГРНИП</label>
            <label><input type="checkbox" checked data-rule="snils"> 🆔 СНИЛС</label>
            <label><input type="checkbox" checked data-rule="address"> 📍 Адрес</label>
        </div>

        <div class="btn-group">
            <button id="loadBtn">🔄 Загрузить модель</button>
            <button id="runBtn" disabled>🔒 Анонимизировать</button>
            <button id="debugBtn" style="background:#64748b;color:white">🐛 Отладка</button>
        </div>
        
        <div id="status">Нажмите "Загрузить модель"</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        
        <textarea id="inputText" disabled placeholder="Вставьте текст...">Иванов Иван Петрович работает в ООО Яндекс. Паспорт серия 4510 номер 123456, ИНН 7701234567. Проживает по адресу: ул. Ленина, д. 15, кв. 3.</textarea>
        
        <div class="debug" id="debugPanel"></div>
        
        <div class="hint">
            <strong>Как работает:</strong> Комбинирует NER-нейросеть (контекст) и регулярные выражения (структура). 
            Все вычисления локальны. Конфигурацию можно вынести в отдельный <code>config.js</code>.
        </div>
    </div>

    <script type="module">
        // ==========================================
        // 📦 КОНФИГУРАЦИЯ (можно вынести в config.js)
        // ==========================================
        const ANONYMIZER_CONFIG = {
            // Маппинг меток нейросети
            nerLabels: {
                PER: 'ФИО', PERSON: 'ФИО',
                LAST_NAME: 'ФАМИЛИЯ', FIRST_NAME: 'ИМЯ', MIDDLE_NAME: 'ОТЧЕСТВО',
                ORG: 'ОРГАНИЗАЦИЯ', ORGANIZATION: 'ОРГАНИЗАЦИЯ',
                LOC: 'МЕСТО', GPE: 'ЛОКАЦИЯ', MISC: 'ДРУГОЕ'
            },
            // Правила регулярных выражений
            regexRules: [
                { id: 'passport', label: 'ПАСПОРТ', pattern: /(?:серия\s*)?\d{2}\s*\d{2}\s*(?:номер\s*)?\d{6}/gi, desc: 'Серия и номер паспорта' },
                { id: 'inn', label: 'ИНН', pattern: /(?:ИНН\s*:?\s*)?\d{10,12}\b/gi, desc: 'ИНН (10 или 12 цифр)' },
                { id: 'ogrn', label: 'ОГРН', pattern: /(?:ОГРН[ИП]?\s*:?\s*)?\d{13,15}\b/gi, desc: 'ОГРН или ОГРНИП' },
                { id: 'snils', label: 'СНИЛС', pattern: /(?:СНИЛС\s*:?\s*)?(?:\d{3}-\d{3}-\d{3}\s?\d{2}|\d{11})\b/gi, desc: 'СНИЛС' },
                { id: 'address', label: 'АДРЕС', pattern: /(?:ул\.|улица|пр-кт|проспект|пер\.|переулок|пл\.|площадь|бул\.|бульвар|ш\.|шоссе|наб\.|набережная|д\.|дом|кв\.|квартира|офис|помещение)\s+[А-ЯЁа-яё\d\s\-\.,«»"'/#№]{3,40}/gi, desc: 'Улица, дом, квартира' }
            ],
            settings: {
                nerThreshold: 0.5,
                modelId: 'onnx-community/bert-base-NER-Russian-ONNX'
            }
        };

        // ==========================================
        // ⚙️ ЯДРО ОБРАБОТКИ
        // ==========================================
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

        if (window.location.protocol === 'file:') document.getElementById('fileWarning').style.display = 'block';
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const loadBtn = document.getElementById('loadBtn');
        const runBtn = document.getElementById('runBtn');
        const debugBtn = document.getElementById('debugBtn');
        const textarea = document.getElementById('inputText');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const debugPanel = document.getElementById('debugPanel');

        let pipe, lastDebug = '';

        // Получаем активные правила из чекбоксов
        function getActiveRules() {
            const active = new Set();
            document.querySelectorAll('#rulesPanel input:checked').forEach(cb => active.add(cb.dataset.rule));
            return {
                useNer: active.has('ner'),
                regexRules: ANONYMIZER_CONFIG.regexRules.filter(r => active.has(r.id))
            };
        }

        // Загрузка модели
        loadBtn.addEventListener('click', async () => {
            loadBtn.disabled = true; loadBtn.textContent = '⏳ Загрузка...';
            status.textContent = '⏳ Инициализация...';
            progressBar.className = 'progress-bar'; progressBar.style.width = '10%';
            try {
                pipe = await pipeline('token-classification', ANONYMIZER_CONFIG.settings.modelId, {
                    progress_callback: (e) => {
                        if (e.total && e.loaded) {
                            const pct = Math.min(95, Math.round((e.loaded / e.total) * 100));
                            progressBar.style.width = `${pct}%`; status.textContent = `⏳ ${e.file || 'Загрузка'}: ${pct}%`;
                        } else if (e.status === 'ready') {
                            progressBar.style.width = '100%'; status.textContent = '✅ Модель готова!';
                        }
                    }
                });
                progressBar.className = 'progress-bar success'; progressBar.style.width = '100%';
                status.textContent = '✅ Модель готова!';
                loadBtn.textContent = '✅ Загружено'; loadBtn.style.background = '#10b981';
                textarea.disabled = false; runBtn.disabled = false;
            } catch (err) {
                progressBar.className = 'progress-bar error'; progressBar.style.width = '100%';
                status.textContent = `❌ Ошибка: ${err.message}`;
                loadBtn.disabled = false; loadBtn.textContent = '🔄 Загрузить модель';
            }
        });

        // Основная функция анонимизации
        runBtn.addEventListener('click', async () => {
            const text = textarea.value.trim();
            if (!text) { status.textContent = '⚠️ Введите текст'; return; }

            runBtn.disabled = true; status.textContent = '⏳ Анализ...';
            progressBar.className = 'progress-bar'; progressBar.style.width = '20%';
            debugPanel.classList.remove('show'); lastDebug = '';

            try {
                const { useNer, regexRules } = getActiveRules();
                const allEntities = [];

                // 1. NER
                if (useNer && pipe) {
                    const nerResults = await pipe(text, { aggregation_strategy: 'simple' });
                    nerResults.forEach(e => {
                        if (e.score >= ANONYMIZER_CONFIG.settings.nerThreshold && typeof e.start === 'number') {
                            allEntities.push({
                                start: e.start, end: e.end,
                                type: ANONYMIZER_CONFIG.nerLabels[e.entity_group] || e.entity_group?.toUpperCase() || 'СУЩНОСТЬ',
                                score: e.score, text: text.slice(e.start, e.end), source: 'ner'
                            });
                        }
                    });
                }

                // 2. Regex
                if (regexRules.length > 0) {
                    for (const rule of regexRules) {
                        rule.pattern.lastIndex = 0; // Сброс для повторного использования
                        for (const match of text.matchAll(rule.pattern)) {
                            allEntities.push({
                                start: match.index, end: match.index + match[0].length,
                                type: rule.label, score: 1.0, text: match[0], source: 'regex'
                            });
                        }
                    }
                }

                lastDebug = `🔍 Найдено сущностей: ${allEntities.length}\n`;
                lastDebug += allEntities.map((e, i) => `#${i+1} [${e.source}] ${e.type} "${e.text}" (${e.start}-${e.end}) conf:${e.score.toFixed(2)}`).join('\n') + '\n\n';

                // 3. Разрешение перекрытий
                allEntities.sort((a, b) => a.start - b.start);
                const merged = [];
                for (const ent of allEntities) {
                    if (!merged.length || ent.start >= merged[merged.length - 1].end) {
                        merged.push(ent);
                    } else {
                        // Приоритет: выше score → длиннее совпадение → regex > ner
                        const last = merged[merged.length - 1];
                        const shouldReplace = ent.score > last.score || 
                                              (ent.score === last.score && (ent.end - ent.start > last.end - last.start)) ||
                                              (ent.source === 'regex' && last.source === 'ner');
                        if (shouldReplace) merged[merged.length - 1] = ent;
                    }
                }

                // 4. Замена с конца
                let result = text;
                merged.reverse().forEach(e => {
                    result = result.slice(0, e.start) + `[${e.type}]` + result.slice(e.end);
                });

                textarea.value = result;
                progressBar.className = 'progress-bar success'; progressBar.style.width = '100%';
                status.textContent = `✅ Готово! Заменено ${merged.length} сущностей.`;
                
                lastDebug += `📝 Итог:\n${result}`;
                if (merged.length === 0) { debugPanel.textContent = lastDebug; debugPanel.classList.add('show'); }
            } catch (err) {
                console.error(err);
                progressBar.className = 'progress-bar error'; progressBar.style.width = '100%';
                status.textContent = '❌ Ошибка обработки.';
            } finally {
                runBtn.disabled = false;
            }
        });

        // Отладка
        debugBtn.addEventListener('click', () => {
            debugPanel.textContent = lastDebug || 'Обработайте текст для просмотра отладки';
            debugPanel.classList.toggle('show');
        });
    </script>
</body>
</html>
