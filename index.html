<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (исправленная версия)</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --error: #ef4444; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 850px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: #0f172a; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        textarea { width: 100%; height: 200px; margin: 1rem 0; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; resize: vertical; background: #f8fafc; font-family: monospace; }
        textarea:disabled { background: #e2e8f0; cursor: not-allowed; }
        .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.5rem 0; }
        button { padding: 0.6rem 1.2rem; font-size: 14px; font-weight: 500; cursor: pointer; border: none; border-radius: 6px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #loadBtn { background: var(--primary); color: white; }
        #runBtn { background: var(--success); color: white; }
        #status { margin: 0.5rem 0; font-weight: 500; min-height: 1.2rem; }
        .progress { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin: 0.5rem 0; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        .progress-bar.success { background: var(--success); }
        .progress-bar.error { background: var(--error); }
        .hint { font-size: 0.85rem; color: #64748b; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
        .warning { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 0.8rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .debug { font-size: 0.8rem; color: #64748b; margin-top: 0.5rem; font-family: monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; display: none; }
        .debug.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 Анонимизация текстов</h1>
        
        <div id="fileWarning" class="warning">
            ⚠️ Откройте через локальный сервер: <code>python -m http.server 8000</code>
        </div>

        <div class="btn-group">
            <button id="loadBtn">🔄 Загрузить модель</button>
            <button id="runBtn" disabled>🔒 Анонимизировать</button>
            <button id="debugToggle" style="background:#64748b;color:white">🐛 Отладка</button>
        </div>
        
        <div id="status">Нажмите "Загрузить модель"</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        
        <textarea id="inputText" disabled placeholder="Введите текст...">Иванов Иван Петрович работает в ООО Яндекс. Телефон: +7 (999) 123-45-67</textarea>
        
        <div class="debug" id="debugPanel"></div>
        
        <div class="hint">
            <strong>Модель:</strong> <code>onnx-community/bert-base-NER-Russian-ONNX</code><br>
            <strong>Приватность:</strong> Все вычисления локально
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

        if (window.location.protocol === 'file:') {
            document.getElementById('fileWarning').style.display = 'block';
        }

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const loadBtn = document.getElementById('loadBtn');
        const runBtn = document.getElementById('runBtn');
        const debugToggle = document.getElementById('debugToggle');
        const textarea = document.getElementById('inputText');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const debugPanel = document.getElementById('debugPanel');

        let pipe;
        let modelLoaded = false;
        let lastDebug = '';

        // --- Загрузка модели ---
        loadBtn.addEventListener('click', async () => {
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳ Загрузка...';
            status.textContent = '⏳ Инициализация...';
            progressBar.className = 'progress-bar';
            progressBar.style.width = '10%';

            try {
                const MODEL_ID = 'onnx-community/bert-base-NER-Russian-ONNX';
                
                pipe = await pipeline(
                    'token-classification',
                    MODEL_ID,
                    {
                        progress_callback: (e) => {
                            if (e.status === 'download' || e.status === 'progress') {
                                if (e.total && e.loaded) {
                                    const pct = Math.min(95, Math.round((e.loaded / e.total) * 100));
                                    progressBar.style.width = `${pct}%`;
                                    status.textContent = `⏳ ${e.file || 'Загрузка'}: ${pct}%`;
                                }
                            } else if (e.status === 'ready') {
                                progressBar.style.width = '100%';
                                status.textContent = '✅ Модель загружена!';
                            }
                        }
                    }
                );

                modelLoaded = true;
                progressBar.className = 'progress-bar success';
                progressBar.style.width = '100%';
                status.textContent = '✅ Модель готова!';
                loadBtn.textContent = '✅ Загружено';
                loadBtn.style.background = '#10b981';
                textarea.disabled = false;
                runBtn.disabled = false;
                
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                progressBar.className = 'progress-bar error';
                progressBar.style.width = '100%';
                status.textContent = `❌ Ошибка: ${err.message}`;
                loadBtn.disabled = false;
                loadBtn.textContent = '🔄 Загрузить модель';
            }
        });

        // --- Обработка текста ---
        runBtn.addEventListener('click', async () => {
            const text = textarea.value.trim();
            if (!text) {
                status.textContent = '⚠️ Введите текст';
                return;
            }

            runBtn.disabled = true;
            status.textContent = '⏳ Анализ...';
            progressBar.className = 'progress-bar';
            progressBar.style.width = '20%';
            debugPanel.classList.remove('show');
            lastDebug = '';

            try {
                // ✅ КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ: aggregation_strategy: 'simple'
                // Возвращает сущности с корректными start/end в символах
                const results = await pipe(text, { 
                    aggregation_strategy: 'simple' 
                });
                
                // Логируем сырые данные
                lastDebug = `🔍 Сырые результаты модели:\n${JSON.stringify(results.slice(0, 5), null, 2)}\n\n`;
                
                // Фильтрация и маппинг типов
                const THRESHOLD = 0.3;
                const labels = { 
                    PER: 'ФИО', PERSON: 'ФИО', 
                    LAST_NAME: 'ФАМИЛИЯ', FIRST_NAME: 'ИМЯ', MIDDLE_NAME: 'ОТЧЕСТВО',
                    ORG: 'ОРГАНИЗАЦИЯ', ORGANIZATION: 'ОРГАНИЗАЦИЯ',
                    LOC: 'МЕСТО', GPE: 'ЛОКАЦИЯ', MISC: 'ДРУГОЕ'
                };
                
                let result = text;
                const replacements = [];
                
                // Фильтруем и сортируем
                const valid = results
                    .filter(e => e.score >= THRESHOLD)
                    .sort((a, b) => a.start - b.start);
                
                // Убираем перекрытия
                const merged = [];
                for (const e of valid) {
                    if (!merged.length || e.start >= merged[merged.length-1].end) {
                        merged.push(e);
                    } else if (e.score > merged[merged.length-1].score) {
                        merged[merged.length-1] = e;
                    }
                }
                
                lastDebug += `✅ После фильтрации и слияния: ${merged.length} сущностей\n\n`;
                
                // Замена с конца (чтобы индексы не сбились)
                for (let i = merged.length - 1; i >= 0; i--) {
                    const e = merged[i];
                    const label = labels[e.entity_group] || e.entity_group?.toUpperCase() || 'СУЩНОСТЬ';
                    
                    // ✅ ЗАЩИТА: проверяем, что индексы валидны
                    if (typeof e.start !== 'number' || typeof e.end !== 'number' || e.start < 0 || e.end > text.length) {
                        lastDebug += `⚠️ Пропущена сущность с невалидными индексами: ${JSON.stringify(e)}\n`;
                        continue;
                    }
                    
                    const original = text.slice(e.start, e.end);
                    replacements.push({
                        start: e.start,
                        end: e.end,
                        original: original,
                        label: label,
                        score: e.score.toFixed(3)
                    });
                    
                    result = result.slice(0, e.start) + `[${label}]` + result.slice(e.end);
                }
                
                lastDebug += `📝 Замены:\n${replacements.map(r => `  [${r.start}-${r.end}] "${r.original}" → [${r.label}]`).join('\n')}\n\n`;
                lastDebug += `📄 Итоговый текст:\n${result}`;
                
                // Обновляем textarea
                textarea.value = result;
                progressBar.className = 'progress-bar success';
                progressBar.style.width = '100%';
                status.textContent = `✅ Готово! Заменено ${replacements.length} сущностей.`;
                
                // Показываем отладку если замен мало или нет
                if (replacements.length === 0) {
                    debugPanel.textContent = lastDebug;
                    debugPanel.classList.add('show');
                    status.textContent += ' (см. отладку)';
                }
                
            } catch (err) {
                console.error('Ошибка обработки:', err);
                progressBar.className = 'progress-bar error';
                progressBar.style.width = '100%';
                status.textContent = '❌ Ошибка при анализе.';
            } finally {
                runBtn.disabled = false;
            }
        });

        // Переключение отладки
        debugToggle.addEventListener('click', () => {
            if (lastDebug) {
                debugPanel.textContent = lastDebug;
                debugPanel.classList.toggle('show');
            } else {
                debugPanel.textContent = 'Обработайте текст, чтобы увидеть отладку';
                debugPanel.classList.add('show');
            }
        });
    </script>
</body>
</html>
