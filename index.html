<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор текстов</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; background: #f8f9fa; }
        textarea { width: 100%; height: 250px; margin: 1em 0; padding: 0.8em; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; resize: vertical; }
        button { padding: 0.6em 1.5em; font-size: 16px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin: 0.5em 0; font-weight: 500; color: #334155; min-height: 1.2em; }
        #progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin: 0.5em 0; }
        #progress-fill { height: 100%; width: 0%; background: #10b981; transition: width 0.3s; }
        .note { font-size: 0.9em; color: #64748b; margin-top: 2em; border-top: 1px solid #e2e8f0; padding-top: 1em; }
    </style>
</head>
<body>
    <h1>🔒 Анонимизация текстов (онлайн)</h1>
    <textarea id="inputText" placeholder="Вставьте текст для обработки...">Иванов Иван Петрович работает в ООО Яндекс в Москве. Телефон: +7 (916) 555-44-33</textarea>
    <button id="anonymizeBtn" disabled>Анонимизировать</button>
    <div id="status">Инициализация...</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="note">
        <strong>Как это работает:</strong> Модель загружается один раз (~45 МБ) и кэшируется в браузере. 
        Обработка происходит локально, данные <strong>не отправляются</strong> на сервер.
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

        // ✅ Правильные настройки:
        env.allowLocalModels = false;      // Не искать локально, грузить с HF
        env.useBrowserCache = true;        // Кэшировать в IndexedDB
        // ❌ НЕ устанавливаем remoteHost — он ломает пути к моделям

        const statusDiv = document.getElementById('status');
        const progressFill = document.getElementById('progress-fill');
        const button = document.getElementById('anonymizeBtn');
        const textarea = document.getElementById('inputText');

        let pipe;

        async function loadModel() {
            statusDiv.textContent = '⏳ Загрузка модели (~45 МБ)...';
            try {
                // ✅ Используем проверенную модель из onnx-community
                pipe = await pipeline(
                    'token-classification',
                    'onnx-community/distilbert-base-multilingual-cased-finetuned-ner',
                    {
                        progress_callback: (e) => {
                            if (e.status === 'download' || e.status === 'progress') {
                                if (e.loaded && e.total) {
                                    const pct = Math.round((e.loaded / e.total) * 100);
                                    statusDiv.textContent = `⏳ Загрузка: ${pct}%`;
                                    progressFill.style.width = `${pct}%`;
                                }
                            } else if (e.status === 'ready') {
                                statusDiv.textContent = '✅ Модель готова!';
                                progressFill.style.width = '100%';
                                button.disabled = false;
                            }
                        }
                    }
                );
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                if (err.message?.includes('404')) {
                    statusDiv.innerHTML = '❌ Модель не найдена. Проверьте название или подключение.';
                } else if (err.message?.includes('401') || err.message?.includes('CORS')) {
                    statusDiv.innerHTML = '❌ Ошибка доступа. Убедитесь, что страница открыта через <code>https://</code>.';
                } else {
                    statusDiv.textContent = '❌ Ошибка загрузки. Обновите страницу.';
                }
                progressFill.style.background = '#ef4444';
            }
        }

        loadModel();

        button.addEventListener('click', async () => {
            const text = textarea.value.trim();
            if (!text) {
                statusDiv.textContent = '⚠️ Введите текст.';
                return;
            }

            button.disabled = true;
            statusDiv.textContent = '⏳ Анализ...';
            progressFill.style.width = '0%';
            progressFill.style.background = '#10b981';

            try {
                // Чанкование для стабильности на длинных текстах
                const CHUNK_SIZE = 450, OVERLAP = 60;
                const chunks = [];
                for (let i = 0; i < text.length; i += CHUNK_SIZE - OVERLAP) {
                    chunks.push({ text: text.slice(i, i + CHUNK_SIZE), offset: i });
                }

                const allEntities = [];
                for (let idx = 0; idx < chunks.length; idx++) {
                    const chunk = chunks[idx];
                    progressFill.style.width = `${Math.round(((idx+1)/chunks.length)*100)}%`;
                    
                    // aggregation_strategy: 'simple' склеивает B-PER + I-PER автоматически
                    const results = await pipe(chunk.text, { aggregation_strategy: 'simple' });
                    
                    for (const ent of results) {
                        allEntities.push({
                            start: ent.start + chunk.offset,
                            end: ent.end + chunk.offset,
                            type: ent.entity_group || ent.entity,
                            score: ent.score
                        });
                    }
                }

                // Фильтрация по уверенности
                const THRESHOLD = 0.65;
                let filtered = allEntities.filter(e => e.score >= THRESHOLD);

                // Разрешение перекрытий (оставляем сущность с большим score)
                filtered.sort((a, b) => a.start - b.start);
                const merged = [];
                for (const ent of filtered) {
                    if (!merged.length || ent.start >= merged[merged.length-1].end) {
                        merged.push(ent);
                    } else if (ent.score > merged[merged.length-1].score) {
                        merged[merged.length-1] = ent;
                    }
                }

                // Замена с конца, чтобы индексы не сбились
                let result = text;
                merged.reverse().forEach(ent => {
                    const label = {
                        PER: 'ФИО', PERSON: 'ФИО', 
                        ORG: 'ОРГАНИЗАЦИЯ', 
                        LOC: 'МЕСТО', GPE: 'ЛОКАЦИЯ',
                        MISC: 'ДРУГОЕ'
                    }[ent.type] || ent.type.toUpperCase();
                    result = result.slice(0, ent.start) + `[${label}]` + result.slice(ent.end);
                });

                textarea.value = result;
                statusDiv.textContent = `✅ Готово! Заменено ${merged.length} сущностей.`;
            } catch (err) {
                console.error('Ошибка обработки:', err);
                statusDiv.textContent = '❌ Ошибка при обработке текста.';
                progressFill.style.background = '#ef4444';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
