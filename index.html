<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (Gherman BERT - Fixed)</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --bg: #f8fafc; --card: #fff; }
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: #0f172a; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        textarea { width: 100%; height: 280px; margin: 1rem 0; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; resize: vertical; background: #f8fafc; font-family: monospace; }
        textarea:disabled { background: #e2e8f0; cursor: not-allowed; }
        .btn-group { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 0.5rem 0; }
        button { padding: 0.6rem 1rem; font-size: 14px; font-weight: 500; cursor: pointer; border: none; border-radius: 6px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #loadBtn { background: var(--primary); color: white; }
        #runBtn { background: var(--success); color: white; }
        #status { margin: 0.5rem 0; font-weight: 500; min-height: 1.2rem; }
        .progress { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin: 0.5rem 0; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        .progress-bar.success { background: var(--success); }
        .progress-bar.error { background: #ef4444; }
        .debug { font-size: 0.75rem; color: #475569; margin-top: 0.5rem; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; display: none; background: #f8fafc; padding: 0.5rem; border-radius: 6px; border: 1px solid #e2e8f0; }
        .debug.show { display: block; }
        .hint { font-size: 0.85rem; color: #64748b; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
        .warning { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 0.8rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .rules-panel { background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin: 0.5rem 0; font-size: 0.85rem; }
        .rules-panel label { display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 Анонимизация (Gherman BERT - Fixed)</h1>
        <div id="fileWarning" class="warning">⚠️ Запустите через: <code>python -m http.server 8000</code></div>

        <div class="rules-panel" id="rulesPanel">
            <strong>Типы сущностей:</strong><br>
            <label><input type="checkbox" checked data-rule="PER"> 👤 ФИО</label>
            <label><input type="checkbox" checked data-rule="LOC"> 📍 Локации</label>
            <label><input type="checkbox" checked data-rule="ORG"> 🏢 Организации (Regex)</label>
            <label><input type="checkbox" checked data-rule="struct"> 🔢 Документы</label>
        </div>

        <div class="btn-group">
            <button id="loadBtn">🔄 Загрузить модель</button>
            <button id="runBtn" disabled>🔒 Анонимизировать</button>
            <button id="debugBtn" style="background:#64748b;color:white">🐛 Отладка</button>
        </div>
        
        <div id="status">Нажмите "Загрузить модель"</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <textarea id="inputText" disabled placeholder="Вставьте текст...">Иванов Иван Петрович из Москвы работает в ООО Яндекс.</textarea>
        <div class="debug" id="debugPanel"></div>
        <div class="hint">
            <strong>Исправлено:</strong> Чтение типа из поля <code>entity</code>, очистка префиксов BIOLU, добавлен regex для организаций.
        </div>
    </div>

    <script type="module">
        const CONFIG = {
            modelId: 'onnx-community/bert-base-NER-Russian-ONNX', 
            nerThreshold: 0.5,
            chunkSize: 450,
            overlap: 60,
            // Маппинг чистых типов (без B-, I-)
            labels: {
                'LAST_NAME': 'ФАМИЛИЯ', 'FIRST_NAME': 'ИМЯ', 'MIDDLE_NAME': 'ОТЧЕСТВО',
                'COUNTRY': 'СТРАНА', 'REGION': 'РЕГИОН', 'CITY': 'ГОРОД',
                'DISTRICT': 'РАЙОН', 'STREET': 'УЛИЦА', 'HOUSE': 'ДОМ',
                'MISC': 'ДРУГОЕ'
            },
            // Паттерны для Организаций и Документов (модель их не видит)
            fallbackPatterns: [
                { id: 'ORG', label: 'ОРГАНИЗАЦИЯ', pattern: /\b(?:ООО|ЗАО|ОАО|ПАО|ИП|АО|НКО|ФГУП)\s*[«"]?[А-ЯЁ][А-ЯЁа-яё\s\-\.,&«»"'#№]{2,60}[»"]?/gi },
                { id: 'PASSPORT', label: 'ПАСПОРТ', pattern: /(?:серия\s*)?\d{2}\s*\d{2}\s*(?:номер\s*)?\d{6}/gi },
                { id: 'INN', label: 'ИНН', pattern: /(?:ИНН\s*:?\s*)?\d{10,12}\b/gi },
                { id: 'OGRN', label: 'ОГРН', pattern: /(?:ОГРН[ИП]?\s*:?\s*)?\d{13,15}\b/gi },
                { id: 'SNILS', label: 'СНИЛС', pattern: /(?:СНИЛС\s*:?\s*)?(?:\d{3}-\d{3}-\d{3}\s?\d{2}|\d{11})\b/gi }
            ]
        };

        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';
        if (window.location.protocol === 'file:') document.getElementById('fileWarning').style.display = 'block';
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const loadBtn = document.getElementById('loadBtn');
        const runBtn = document.getElementById('runBtn');
        const debugBtn = document.getElementById('debugBtn');
        const textarea = document.getElementById('inputText');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const debugPanel = document.getElementById('debugPanel');
        let pipe, lastDebug = '';

        function getActiveTypes() {
            const active = new Set();
            document.querySelectorAll('#rulesPanel input:checked').forEach(cb => active.add(cb.dataset.rule));
            return active;
        }

        loadBtn.addEventListener('click', async () => {
            loadBtn.disabled = true; loadBtn.textContent = '⏳ Загрузка...';
            status.textContent = '⏳ Инициализация...';
            progressBar.className = 'progress-bar'; progressBar.style.width = '10%';
            try {
                pipe = await pipeline('token-classification', CONFIG.modelId, {
                    progress_callback: (e) => {
                        if (e.total && e.loaded) {
                            const pct = Math.min(95, Math.round((e.loaded / e.total) * 100));
                            progressBar.style.width = `${pct}%`; status.textContent = `⏳ ${e.file || 'Загрузка'}: ${pct}%`;
                        } else if (e.status === 'ready') {
                            progressBar.style.width = '100%'; status.textContent = '✅ Модель готова!';
                        }
                    }
                });
                progressBar.className = 'progress-bar success'; progressBar.style.width = '100%';
                status.textContent = '✅ Модель готова!';
                loadBtn.textContent = '✅ Загружено'; loadBtn.style.background = '#10b981';
                textarea.disabled = false; runBtn.disabled = false;
            } catch (err) {
                console.error(err);
                progressBar.className = 'progress-bar error'; progressBar.style.width = '100%';
                status.textContent = `❌ Ошибка: ${err.message}`;
                loadBtn.disabled = false; loadBtn.textContent = '🔄 Загрузить модель';
            }
        });

        runBtn.addEventListener('click', async () => {
            const text = textarea.value.trim();
            if (!text) { status.textContent = '⚠️ Введите текст'; return; }
            const types = getActiveTypes();

            runBtn.disabled = true; status.textContent = '⏳ Анализ...';
            progressBar.className = 'progress-bar'; progressBar.style.width = '5%';
            debugPanel.classList.remove('show'); lastDebug = '';

            try {
                const allEntities = [];
                let rawSampleLogged = false;

                // 1. NER (Модель Gherman)
                if ((types.has('PER') || types.has('LOC')) && pipe) {
                    const { chunkSize, overlap } = CONFIG;
                    const chunks = [];
                    for (let i = 0; i < text.length; i += chunkSize - overlap) {
                        chunks.push({ text: text.slice(i, i + chunkSize), offset: i });
                    }

                    for (let i = 0; i < chunks.length; i++) {
                        progressBar.style.width = `${5 + Math.round(((i + 1) / chunks.length) * 40)}%`;
                        
                        // Важно: используем aggregation_strategy: 'none' чтобы получить все токены и собрать их вручную
                        // Так надежнее для этой модели
                        const res = await pipe(chunks[i].text, { aggregation_strategy: 'none' });
                        
                        if (!rawSampleLogged && res.length > 0) {
                            lastDebug += `🔎 Сырой вывод модели (пример):\n`;
                            res.slice(0, 5).forEach(e => {
                                lastDebug += `  Entity: "${e.entity}" | Word: "${e.word}"\n`;
                            });
                            lastDebug += '\n';
                            rawSampleLogged = true;
                        }

                        // Ручная сборка сущностей из токенов
                        let currentEntity = null;
                        for (const token of res) {
                            const rawLabel = token.entity; // например "B-CITY"
                            if (!rawLabel || rawLabel === 'O') {
                                if (currentEntity) {
                                    allEntities.push(currentEntity);
                                    currentEntity = null;
                                }
                                continue;
                            }

                            const parts = rawLabel.split('-');
                            const prefix = parts[0]; // B, I, L, U
                            const type = parts.slice(1).join('-'); // CITY, LAST_NAME...
                            const cleanType = CONFIG.labels[type];

                            if (!cleanType) {
                                if (currentEntity) { allEntities.push(currentEntity); currentEntity = null; }
                                continue;
                            }

                            // Фильтр по чекбоксам
                            const isPer = ['ФАМИЛИЯ', 'ИМЯ', 'ОТЧЕСТВО'].includes(cleanType);
                            const isLoc = ['ГОРОД', 'УЛИЦА', 'ДОМ', 'РЕГИОН', 'СТРАНА', 'РАЙОН'].includes(cleanType);
                            if ((isPer && !types.has('PER')) || (isLoc && !types.has('LOC'))) {
                                if (currentEntity) { allEntities.push(currentEntity); currentEntity = null; }
                                continue;
                            }

                            if (prefix === 'B' || prefix === 'U') {
                                if (currentEntity) allEntities.push(currentEntity);
                                currentEntity = {
                                    start: token.start + chunks[i].offset,
                                    end: token.end + chunks[i].offset,
                                    type: cleanType,
                                    score: token.score,
                                    text: token.word,
                                    source: 'ner'
                                };
                            } else if (prefix === 'I' || prefix === 'L') {
                                if (currentEntity && currentEntity.type === cleanType) {
                                    currentEntity.end = token.end + chunks[i].offset;
                                    currentEntity.text += token.word;
                                    currentEntity.score = Math.min(currentEntity.score, token.score);
                                } else {
                                    if (currentEntity) allEntities.push(currentEntity);
                                    currentEntity = {
                                        start: token.start + chunks[i].offset,
                                        end: token.end + chunks[i].offset,
                                        type: cleanType,
                                        score: token.score,
                                        text: token.word,
                                        source: 'ner'
                                    };
                                }
                            }
                        }
                        if (currentEntity) allEntities.push(currentEntity);
                    }
                }

                // 2. Fallback Patterns (Организации и Документы)
                if (types.has('ORG') || types.has('struct')) {
                    for (const rule of CONFIG.fallbackPatterns) {
                        if (rule.id === 'ORG' && !types.has('ORG')) continue;
                        if (['PASSPORT','INN','OGRN','SNILS'].includes(rule.id) && !types.has('struct')) continue;

                        rule.pattern.lastIndex = 0;
                        for (const m of text.matchAll(rule.pattern)) {
                            allEntities.push({
                                start: m.index, end: m.index + m[0].length,
                                type: rule.label, score: 1.0, text: m[0], source: 'regex'
                            });
                        }
                    }
                }

                // 3. Слияние ФИО
                allEntities.sort((a, b) => a.start - b.start);
                const merged = [];
                for (const ent of allEntities) {
                    const isPerPart = ['ФАМИЛИЯ', 'ИМЯ', 'ОТЧЕСТВО'].includes(ent.type);
                    const lastIsPerPart = merged.length && ['ФАМИЛИЯ', 'ИМЯ', 'ОТЧЕСТВО', 'ФИО'].includes(merged[merged.length-1].type);
                    
                    if (merged.length && ent.start <= merged[merged.length - 1].end + 2 && isPerPart && lastIsPerPart) {
                        const last = merged[merged.length - 1];
                        last.end = Math.max(last.end, ent.end);
                        last.text = text.slice(last.start, last.end);
                        last.type = 'ФИО';
                        last.score = Math.max(last.score, ent.score);
                    } else if (!merged.length || ent.start > merged[merged.length - 1].end) {
                        merged.push(ent);
                    } else if (ent.score > merged[merged.length - 1].score) {
                        merged[merged.length - 1] = ent;
                    }
                }

                // Лог
                lastDebug += `🔍 Найдено сущностей: ${merged.length}\n`;
                lastDebug += merged.map((e, i) => `#${i+1} [${e.source}] ${e.type} "${e.text}" (${e.start}-${e.end})`).join('\n') + '\n\n';

                // 4. Замена
                let result = text;
                merged.reverse().forEach(e => {
                    result = result.slice(0, e.start) + `[${e.type}]` + result.slice(e.end);
                });

                textarea.value = result;
                progressBar.className = 'progress-bar success'; progressBar.style.width = '100%';
                status.textContent = `✅ Готово! Заменено ${merged.length} сущностей.`;
                lastDebug += `📝 Итог:\n${result.substring(0, 500)}...`;
            } catch (err) {
                console.error(err);
                progressBar.className = 'progress-bar error'; progressBar.style.width = '100%';
                status.textContent = '❌ Ошибка обработки.';
            } finally { runBtn.disabled = false; }
        });

        debugBtn.addEventListener('click', () => {
            debugPanel.textContent = lastDebug || 'Обработайте текст для отладки';
            debugPanel.classList.toggle('show');
        });
    </script>
</body>
</html>
