<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимизатор</title>
  <style>
    :root {
      --primary: #2563eb; --success: #10b981; --error: #ef4444;
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px; margin: 2rem auto; padding: 0 1rem;
      background: var(--bg); color: var(--text);
    }
    .card {
      background: var(--card); padding: 1.5rem;
      border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    textarea {
      width: 100%; height: 220px; margin: 1rem 0; padding: 0.8rem;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 15px; resize: vertical; background: #f8fafc;
      font-family: monospace;
    }
    textarea:disabled { background: #e2e8f0; cursor: not-allowed; }
    .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.5rem 0; }
    button {
      padding: 0.6rem 1.2rem; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; border-radius: 6px;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #loadBtn { background: var(--primary); color: white; }
    #runBtn { background: var(--success); color: white; }
    #debugToggle { background: #64748b; color: white; }
    .progress {
      width: 100%; height: 4px; background: var(--border);
      border-radius: 2px; overflow: hidden; margin: 0.5rem 0;
    }
    .progress-bar {
      height: 100%; width: 0%; background: var(--primary);
      transition: width 0.3s;
    }
    .progress-bar.success { background: var(--success); }
    .progress-bar.error { background: var(--error); }
    .status { margin: 0.5rem 0; font-weight: 500; min-height: 1.2rem; }
    .hint {
      font-size: 0.85rem; color: var(--muted);
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
    }
    .warning {
      background: #fef3c7; border-left: 4px solid #f59e0b;
      padding: 0.8rem; border-radius: 0 6px 6px 0;
      margin-bottom: 1rem; font-size: 0.9rem; display: none;
    }
    .debug {
      font-size: 0.8rem; color: #334155;
      margin-top: 0.5rem; font-family: monospace;
      white-space: pre-wrap; max-height: 250px; overflow-y: auto;
      background: #f1f5f9; padding: 0.8rem; border-radius: 6px;
      display: none;
    }
    .debug.show { display: block; }
    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.5rem 1rem; margin: 1rem 0;
    }
    .setting label {
      display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;
    }
    .slider-container {
      display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0;
    }
    input[type="range"] { width: 150px; }
    select {
      padding: 0.4rem 0.8rem; border-radius: 6px; 
      border: 1px solid var(--border); background: white;
      font-size: 0.95rem; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🔒 Анонимизатор</h1>

  <div id="fileWarning" class="warning">
    ⚠️ Откройте через локальный сервер: <code>python -m http.server 8000</code><br>
    Данные не передаются на сервер, обрабатываются в локальной памяти вашего ПК.
  </div>

  <!-- 🔀 ВЫБОР МОДЕЛИ -->
  <div class="settings" style="margin-bottom:1rem;">
    <div class="setting">
      <label for="modelSelect"><strong>Выберите модель:</strong></label>
      <select id="modelSelect">
        <option value="onnx-community/bert-base-NER-Russian-ONNX">
          🧠 bert-base-NER-Russian (полная, ~170 МБ)
        </option>
        <option value="alexchebur/ner-rubert-tiny-news-onnx">
          ⚡ ner-rubert-tiny-news ONNX (квантованная, ~28 МБ)
        </option>
      </select>
    </div>
  </div>
  <div id="modelInfo" class="hint" style="margin:-0.5rem 0 1rem 0; font-size:0.85rem;"></div>

  <div class="btn-group">
    <button id="loadBtn">🔄 Загрузить модель</button>
    <button id="runBtn" disabled>🔒 Анонимизировать</button>
    <button id="debugToggle" style="background:#64748b;color:white">🐛 Отладка</button>
  </div>

  <div id="status" class="status">Нажмите «Загрузить модель»</div>
  
  <div class="progress" title="Загрузка модели">
    <div class="progress-bar" id="modelProgressBar"></div>
  </div>
  <div class="progress" title="Обработка текста">
    <div class="progress-bar" id="textProgressBar"></div>
  </div>

  <div class="settings" id="typeSettings"></div>

  <div class="slider-container">
    <label for="nerThreshold">Порог уверенности NER:</label>
    <input type="range" id="nerThreshold" min="0" max="1" step="0.05" value="0.7">
    <span id="thresholdValue">0.95</span>
  </div>

  <textarea id="inputText" disabled placeholder="Введите текст...">Доверенность 
Город Самара Самарской области
...
Паспорт серия 66 66 №666666, выдан ОУФМС России 01.01.2021...</textarea>

  <div class="debug" id="debugPanel"></div>

  <div class="hint">
    <strong>Приватность:</strong> всё обрабатывается локально в браузере 🔐
  </div>
</div>

<script type="module">
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

  if (window.location.protocol === 'file:') {
    document.getElementById('fileWarning').style.display = 'block';
  }

  env.allowLocalModels = false;
  env.useBrowserCache = true;

  // --- КОНФИГУРАЦИЯ МОДЕЛЕЙ ---
  const modelConfigs = {
    'onnx-community/bert-base-NER-Russian-ONNX': {
      name: 'bert-base-NER-Russian',
      size: '~170 МБ',
      entities: {
        PER:        { label: 'ФИО',             enabled: true },
        SINGLE_NAME:{ label: 'ФИО?',            enabled: false },
        ORG:        { label: 'ОРГАНИЗАЦИЯ',     enabled: true },
        TITLE:      { label: 'НАЗВАНИЕ',        enabled: true },
        LOC:        { label: 'МЕСТО',           enabled: true },
        GPE:        { label: 'ЛОКАЦИЯ',         enabled: true },
        MISC:       { label: 'ДРУГОЕ',          enabled: false },
        PASSPORT:   { label: 'ПАСПОРТ',         enabled: true },
        DATE_ISSUE: { label: 'ДАТА',            enabled: true },
        SNILS:      { label: 'СНИЛС',           enabled: true },
        INN:        { label: 'ИНН',             enabled: true },
        OGRN:       { label: 'ОГРН',            enabled: true },
        PHONE:      { label: 'ТЕЛЕФОН',         enabled: true },
        EMAIL:      { label: 'EMAIL',           enabled: true }
      }
    },
    'alexchebur/ner-rubert-tiny-news-onnx': {
      name: 'ner-rubert-tiny-news (ONNX)',
      size: '~28 МБ',
      entities: {
        PER:        { label: 'ФИО',             enabled: true },
        ORG:        { label: 'ОРГАНИЗАЦИЯ',     enabled: true },
        LOC:        { label: 'МЕСТО',           enabled: true },
        GEOPOLIT:   { label: 'РЕГИОН/СТРАНА',   enabled: true },
        MEDIA:      { label: 'СМИ',             enabled: true }
      }
    }
  };

  // Глобальный конфиг сущностей (для совместимости с остальным кодом)
  const entityConfig = { ...modelConfigs['onnx-community/bert-base-NER-Russian-ONNX'].entities };

  // DOM-элементы
  const loadBtn = document.getElementById('loadBtn');
  const runBtn = document.getElementById('runBtn');
  const debugToggle = document.getElementById('debugToggle');
  const textarea = document.getElementById('inputText');
  const status = document.getElementById('status');
  const modelProgressBar = document.getElementById('modelProgressBar');
  const textProgressBar = document.getElementById('textProgressBar');
  const debugPanel = document.getElementById('debugPanel');
  const nerThreshold = document.getElementById('nerThreshold');
  const thresholdValue = document.getElementById('thresholdValue');
  const typeSettings = document.getElementById('typeSettings');
  const modelSelect = document.getElementById('modelSelect');
  const modelInfo = document.getElementById('modelInfo');

  let nerPipeline;
  let modelLoaded = false;
  let lastDebug = '';

  // --- Валидация (оставляем без изменений) ---
  function isValidINN(inn) {
    if (!/^\d{12}$/.test(inn)) return false;
    const d = inn.split('').map(Number);
    const c1 = [7,2,4,10,3,5,9,4,6,8];
    const c2 = [3,7,2,4,10,3,5,9,4,6,8];
    let s1=0, s2=0;
    for (let i=0; i<10; i++) s1 += c1[i]*d[i];
    for (let i=0; i<11; i++) s2 += c2[i]*d[i];
    return d[10]===(s1%11)%10 && d[11]===(s2%11)%10;
  }
  function isValidSNILS(snils) {
    const digits = snils.replace(/[\s-]/g, '');
    if (!/^\d{11}$/.test(digits)) return false;
    const nums = digits.split('').map(Number);
    let sum = 0;
    for (let i=0; i<9; i++) sum += nums[i]*(9-i);
    let control = sum % 101;
    if (control === 100 || control === 101) control = 0;
    return control === parseInt(digits.slice(9,11), 10);
  }
  function isValidOGRN(ogrn) {
    const clean = ogrn.replace(/\D/g, '');
    if (clean.length !== 13 && clean.length !== 15) return false;
    const num = BigInt(clean.slice(0, -1));
    const check = Number(clean.slice(-1));
    const mod = clean.length === 13 ? 11n : 13n;
    const remainder = Number(num % mod);
    return check === (remainder === 10 ? 0 : remainder);
  }

  // --- Regex-сущности (без изменений) ---
  function findRegexEntities(text, baseOffset = 0) {
    const results = [];
    const patterns = [
      { regex: /(?:паспорт|серия|сер\.)\s*(?:серии?\s*)?(?:\d{2}\s*[\-–—]?\s*\d{2}|\d{4})\s*(?:№|номер|N\.?)?\s*\d{6}/giu, type: 'PASSPORT', validate: null },
      { regex: /\b(?:ООО|ПАО|АО|ЗАО|ОАО|ИП|ФГУП|МУП|НКО|Фонд|Группа|Холдинг)\s*[«"]?[^»"\n]{2,100}[»"]?/giu, type: 'ORG', validate: null },
      { regex: /[«"][^»"\n]{3,60}[»"]/g, type: 'TITLE', validate: null },
      { regex: /\b(?:дата\s*(?:выдачи|регистрации)|выдан)\s*\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b/giu, type: 'DATE_ISSUE', validate: null },
      { regex: /\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b/g, type: 'DATE_ISSUE', validate: null },
      { regex: /\b\d{3}\s*[-\s]?\s*\d{3}\s*[-\s]?\s*\d{3}\s*[-\s]?\s*\d{2}\b/g, type: 'SNILS', validate: isValidSNILS },
      { regex: /\b\d{12}\b/g, type: 'INN', validate: isValidINN },
      { regex: /\b\d{13}(?:\d{2})?\b/g, type: 'OGRN', validate: isValidOGRN },
      { regex: /(?:\+?\d{1,3}[\s-]?)?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}\b/g, type: 'PHONE', validate: null },
      { regex: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g, type: 'EMAIL', validate: null }
    ];
    for (const { regex, type, validate } of patterns) {
      let match; regex.lastIndex = 0;
      while ((match = regex.exec(text)) !== null) {
        const word = match[0].trim();
        if (word.length < 3) continue;
        if (validate && !validate(word)) continue;
        results.push({ start: match.index + baseOffset, end: match.index + match[0].length + baseOffset, word, entity_group: type, score: 1.0 });
      }
    }
    return results;
  }

  function findSingleNames(text) {
    const words = [];
    const regex = /\b([А-ЯЁ][а-яё]{1,30})\b/g;
    const stopWords = new Set(['ООО','ЗАО','АО','ПАО','ОАО','ИП','Тел','Телефон','Email','Почта','Адрес','Город','Улица','Дом','Квартира','Паспорт','СНИЛС','ИНН','ОГРН','Яндекс','Гугл','Майл','Рамблер','России','Российской']);
    let match; regex.lastIndex = 0;
    while ((match = regex.exec(text)) !== null) {
      const word = match[0];
      if (stopWords.has(word)) continue;
      words.push({ start: match.index, end: match.index + word.length, word, entity_group: 'SINGLE_NAME', score: 0.5 });
    }
    return words;
  }

  function locateTokens(tokens, text) {
    const located = [];
    let currentPos = 0;
    for (const t of tokens) {
      let word = t.word;
      const isSubword = word.startsWith('##');
      if (isSubword) word = word.slice(2);
      let idx = text.indexOf(word, currentPos);
      if (idx === -1) idx = text.indexOf(word, Math.max(0, currentPos - 5));
      if (idx === -1) continue;
      located.push({ ...t, start: idx, end: idx + word.length, word: text.slice(idx, idx + word.length) });
      currentPos = idx + word.length;
    }
    return located;
  }

  const bioToGroup = {
    LAST_NAME: 'PER', FIRST_NAME: 'PER', MIDDLE_NAME: 'PER',
    ORG: 'ORG', ORGANIZATION: 'ORG',
    LOC: 'LOC', GPE: 'GPE', CITY: 'LOC', STREET: 'LOC', HOUSE: 'LOC', REGION: 'LOC',
    MISC: 'MISC', GEOPOLIT: 'GPE', MEDIA: 'ORG'
  };

  function isSingleCharJunk(e) {
    return e.entity_group === 'PER' && e.word.length === 1 && !e.word.match(/[А-ЯЁA-Z]\.?/);
  }

  function cleanEntities(entities, text) {
    return entities.filter(e => {
      if (e.word.length < 3 && !/^\d+$/.test(e.word)) return false;
      if (/^[а-яё]{1,2}$/i.test(e.word)) return false;
      return true;
    }).map(e => ({ ...e, normKey: e.word.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '').trim() }));
  }

  function mergeAdjacentEntities(entities, text) {
    const merged = [];
    for (const e of entities) {
      if (merged.length === 0) { merged.push({ ...e }); continue; }
      const prev = merged[merged.length - 1];
      const isSameGroup = prev.entity_group === e.entity_group;
      const locOrgMerge = (['LOC','GPE','MISC','ORG'].includes(prev.entity_group) && ['LOC','GPE','MISC','ORG'].includes(e.entity_group));
      if ((isSameGroup || locOrgMerge) && e.start <= prev.end + 3) {
        const between = text.slice(prev.end, e.start);
        if (!between.includes(',') && !between.includes('\n') && !between.includes(';')) {
          prev.end = e.end;
          prev.word = text.slice(prev.start, e.end);
          prev.score = Math.min(prev.score, e.score);
          prev.normKey = prev.word.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '').trim();
        } else { merged.push({ ...e }); }
      } else { merged.push({ ...e }); }
    }
    return merged;
  }

  function deduplicateEntities(entities) {
    entities.sort((a, b) => a.start - b.start);
    const unique = [];
    for (const e of entities) {
      if (unique.length === 0 || e.start >= unique[unique.length - 1].end) {
        unique.push({ ...e });
      } else {
        const prev = unique[unique.length - 1];
        if ((e.end - e.start) > (prev.end - prev.start) || e.score > prev.score) {
          unique[unique.length - 1] = { ...e };
        }
      }
    }
    return unique;
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      }
    }
    return dp[m][n];
  }

  function buildEntityNumbering(entities) {
    const groups = {};
    const numbers = [];
    for (const e of entities) {
      const type = e.entity_group;
      if (!groups[type]) groups[type] = { map: new Map(), nextId: 1 };
      const clean = (e.word || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim().replace(/\s+/g, ' ');
      if (!clean) { numbers.push(1); continue; }
      let id = groups[type].map.get(clean);
      if (!id && (type === 'PER' || type === 'ФИО' || type === 'SINGLE_NAME')) {
        const threshold = Math.max(2, Math.floor(clean.length * 0.3));
        for (const [key, existingId] of groups[type].map) {
          if (key.includes(clean) || clean.includes(key) || levenshtein(clean, key) <= threshold) {
            id = existingId;
            groups[type].map.set(clean, id);
            break;
          }
        }
      }
      if (!id) { id = groups[type].nextId++; groups[type].map.set(clean, id); }
      numbers.push(id);
    }
    return { groups, numbers };
  }

  // ✅ ОБНОВЛЁННАЯ ФУНКЦИЯ ОТРИСОВКИ ЧЕКБОКСОВ
  function renderTypeSettings() {
    const selectedModel = modelSelect.value;
    const modelEntities = modelConfigs[selectedModel].entities;
    
    let html = '';
    // Сначала сущности модели
    for (const [type, cfg] of Object.entries(modelEntities)) {
      if (entityConfig[type]) {
        html += `<div class="setting"><label><input type="checkbox" class="type-check" data-type="${type}" ${cfg.enabled ? 'checked' : ''}> ${cfg.label} (${type})</label></div>`;
      }
    }
    // Затем regex-типы (всегда доступны)
    const regexTypes = ['PASSPORT','DATE_ISSUE','SNILS','INN','OGRN','PHONE','EMAIL'];
    for (const type of regexTypes) {
      if (entityConfig[type] && !modelEntities[type]) {
        html += `<div class="setting"><label><input type="checkbox" class="type-check" data-type="${type}" ${entityConfig[type].enabled ? 'checked' : ''}> ${entityConfig[type].label} (${type}) 🔍</label></div>`;
      }
    }
    typeSettings.innerHTML = html;
    document.querySelectorAll('.type-check').forEach(cb => {
      cb.removeEventListener('change', handleTypeChange);
      cb.addEventListener('change', handleTypeChange);
    });
  }

  function handleTypeChange(e) {
    const type = e.target.dataset.type;
    if (entityConfig[type]) entityConfig[type].enabled = e.target.checked;
    const selectedModel = modelSelect.value;
    if (modelConfigs[selectedModel].entities[type]) {
      modelConfigs[selectedModel].entities[type].enabled = e.target.checked;
    }
  }

  async function processTextWithChunks(text, threshold) {
    const CHUNK_SIZE = 350, OVERLAP = 40;
    const allRaw = [];
    for (let i = 0; i < text.length; i += CHUNK_SIZE - OVERLAP) {
      const chunk = text.slice(i, i + CHUNK_SIZE);
      if (!chunk.trim()) continue;
      const rawTokens = await nerPipeline(chunk, { group_entities: true });
      const located = locateTokens(rawTokens, chunk);
      for (const t of located) {
        if (t.score >= threshold) {
          allRaw.push({ ...t, start: t.start + i, end: t.end + i });
        }
      }
      const pct = Math.min(100, Math.round(((i + chunk.length) / text.length) * 100));
      textProgressBar.style.width = `${pct}%`;
      await new Promise(r => setTimeout(r, 0));
    }
    return allRaw;
  }

  // Загрузка модели
  loadBtn.addEventListener('click', async () => {
    loadBtn.disabled = true;
    loadBtn.textContent = '⏳ Загрузка...';
    status.textContent = '⏳ Инициализация...';
    modelProgressBar.className = 'progress-bar';
    modelProgressBar.style.width = '10%';

    try {
      const selectedModel = modelSelect.value;
      nerPipeline = await pipeline('ner', selectedModel, {
        progress_callback: (e) => {
          if (e.status === 'download' || e.status === 'progress') {
            if (e.total && e.loaded) {
              const pct = Math.min(95, Math.round((e.loaded / e.total) * 100));
              const mbLoaded = (e.loaded / 1024 / 1024).toFixed(1);
              const mbTotal = (e.total / 1024 / 1024).toFixed(1);
              modelProgressBar.style.width = `${pct}%`;
              status.textContent = `${e.file || 'Загрузка'}: ${mbLoaded}/${mbTotal} МБ (${pct}%)`;
            }
          } else if (e.status === 'ready') {
            modelProgressBar.className = 'progress-bar success';
            modelProgressBar.style.width = '100%';
            status.textContent = '✅ Модель загружена!';
          }
        }
      });
      modelLoaded = true;
      modelProgressBar.className = 'progress-bar success';
      modelProgressBar.style.width = '100%';
      status.textContent = '✅ Модель готова!';
      loadBtn.textContent = '✅ Загружено';
      loadBtn.style.background = '#10b981';
      textarea.disabled = false;
      runBtn.disabled = false;
    } catch (err) {
      console.error(err);
      modelProgressBar.className = 'progress-bar error';
      modelProgressBar.style.width = '100%';
      status.textContent = `❌ Ошибка: ${err.message}`;
      loadBtn.disabled = false;
      loadBtn.textContent = '🔄 Загрузить модель';
    }
  });

  // Анонимизация
  runBtn.addEventListener('click', async () => {
    const text = textarea.value;
    if (!text.trim()) { status.textContent = '⚠️ Введите текст'; return; }
    if (!modelLoaded) { status.textContent = '⚠️ Сначала загрузите модель'; return; }

    runBtn.disabled = true;
    status.textContent = '⏳ Анализ...';
    modelProgressBar.className = 'progress-bar';
    textProgressBar.style.width = '0%';
    debugPanel.classList.remove('show');
    lastDebug = '';

    try {
      const threshold = parseFloat(nerThreshold.value);
      const rawTokens = await processTextWithChunks(text, threshold);
      lastDebug += `🔍 NER-токены сырые (${rawTokens.length}):\n${JSON.stringify(rawTokens.slice(0,10), null, 2)}...\n\n`;

      let nerEntities = rawTokens.map(t => {
        const label = t.entity.split('-').slice(1).join('-');
        return {
          start: t.start, end: t.end, word: text.slice(t.start, t.end),
          entity_group: bioToGroup[label] || label || 'MISC', score: t.score
        };
      }).filter(e => !isSingleCharJunk(e));

      const nerMerged = mergeAdjacentEntities(nerEntities, text);
      lastDebug += `🧩 NER после склейки (${nerMerged.length}):\n${JSON.stringify(nerMerged, null, 2)}\n\n`;

      const regexEntities = findRegexEntities(text, 0);
      const singleNames = entityConfig.SINGLE_NAME?.enabled ? findSingleNames(text) : [];
      lastDebug += `🔎 Regex (${regexEntities.length}), Резервные имена (${singleNames.length})\n`;

      let all = [...nerMerged, ...regexEntities, ...singleNames].filter(e => entityConfig[e.entity_group]?.enabled);
      let cleaned = cleanEntities(all, text);
      let merged = mergeAdjacentEntities(cleaned, text);
      let final = deduplicateEntities(merged);
      const { numbers } = buildEntityNumbering(final);
      
      lastDebug += `✅ Итоговые сущности (${final.length}):\n`;
      final.forEach((e, i) => {
        const cfgLabel = entityConfig[e.entity_group]?.label || e.entity_group;
        lastDebug += `  [${e.start}-${e.end}] ${text.slice(e.start, e.end)} → ${cfgLabel}-${numbers[i]} (${e.score.toFixed(3)})\n`;
      });

      let result = text;
      for (let i = final.length - 1; i >= 0; i--) {
        const e = final[i];
        const label = entityConfig[e.entity_group]?.label || e.entity_group;
        const masked = `[${label}-${numbers[i]}]`;
        result = result.slice(0, e.start) + masked + result.slice(e.end);
      }

      textarea.value = result;
      textProgressBar.className = 'progress-bar success';
      textProgressBar.style.width = '100%';
      status.textContent = `✅ Готово! Заменено ${final.length} сущностей.`;
      debugPanel.textContent = lastDebug;
      debugPanel.classList.add('show');

    } catch (err) {
      console.error(err);
      textProgressBar.className = 'progress-bar error';
      textProgressBar.style.width = '100%';
      status.textContent = '❌ Ошибка при анализе.';
      lastDebug += `\n❌ Ошибка: ${err.message}`;
    } finally {
      runBtn.disabled = false;
    }
  });

  // Обработчики
  nerThreshold.addEventListener('input', () => {
    thresholdValue.textContent = parseFloat(nerThreshold.value).toFixed(2);
  });
  
  debugToggle.addEventListener('click', () => {
    if (lastDebug) {
      debugPanel.textContent = lastDebug;
      debugPanel.classList.toggle('show');
    } else {
      debugPanel.textContent = 'Обработайте текст, чтобы увидеть отладку';
      debugPanel.classList.add('show');
    }
  });

  // 🔀 Обработчик выбора модели
  modelSelect.addEventListener('change', (e) => {
    const cfg = modelConfigs[e.target.value];
    modelInfo.innerHTML = `<strong>${cfg.name}</strong> • Размер: ${cfg.size} • Сущности: ${Object.keys(cfg.entities).join(', ')}`;
    renderTypeSettings();
    localStorage.setItem('anon_model_selected', e.target.value);
    // Сбрасываем состояние загрузки при смене модели
    if (modelLoaded) {
      modelLoaded = false;
      loadBtn.disabled = false;
      loadBtn.textContent = '🔄 Загрузить модель';
      loadBtn.style.background = '';
      runBtn.disabled = true;
      textarea.disabled = true;
      status.textContent = '🔄 Модель изменена — загрузите заново';
      modelProgressBar.className = 'progress-bar';
      modelProgressBar.style.width = '0%';
    }
  });

  // Инициализация
  function init() {
    // Восстанавливаем выбор модели из localStorage
    const saved = localStorage.getItem('anon_model_selected');
    if (saved && modelConfigs[saved]) {
      modelSelect.value = saved;
    }
    // Обновляем UI
    const cfg = modelConfigs[modelSelect.value];
    modelInfo.innerHTML = `<strong>${cfg.name}</strong> • Размер: ${cfg.size} • Сущности: ${Object.keys(cfg.entities).join(', ')}`;
    renderTypeSettings();
    thresholdValue.textContent = parseFloat(nerThreshold.value).toFixed(2);
  }
  init();
</script>
</body>
</html>
