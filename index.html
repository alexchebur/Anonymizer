<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимизатор (Pyodide + JS Hybrid)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
        textarea { width: 100%; height: 300px; margin-bottom: 1em; padding: 0.5em; box-sizing: border-box; font-family: monospace; }
        button { padding: 0.5em 2em; font-size: 1em; cursor: pointer; margin-right: 0.5em; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin: 1em 0; color: #555; min-height: 1.2em; }
        .note { font-size: 0.9em; color: #777; margin-top: 2em; border-top: 1px solid #eee; padding-top: 1em; }
        .progress { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin: 0.5em 0; }
        .progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.3s; }
    </style>
</head>
<body>
    <h1>🔒 Анонимизация (Pyodide Lite)</h1>
    
    <div class="btn-group">
        <button id="initBtn">🐍 Загрузить Python</button>
        <button id="runBtn" disabled>Анонимизировать</button>
    </div>
    
    <div id="status">Нажмите "Загрузить Python"</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    
    <textarea id="inputText" disabled placeholder="Введите текст...">Иванов Иван Петрович работает в ООО Яндекс в Москве. Паспорт: 4510 123456.</textarea>
    
    <div class="note">
        <strong>Как работает:</strong> Python (Pyodide) ищет ФИО по словарю, 
        JavaScript ищет организации и документы по regex. 
        Всё локально, безопасно.
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
    
    <script>
        let pyodide = null;
        let ready = false;

        const initBtn = document.getElementById('initBtn');
        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const textarea = document.getElementById('inputText');

        // === 1. Инициализация Pyodide ===
        async function init() {
            initBtn.disabled = true;
            status.textContent = '⏳ Загрузка Pyodide...';
            progressBar.style.width = '10%';

            try {
                // Загружаем ядро
                pyodide = await loadPyodide({
                    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/'
                });
                
                progressBar.style.width = '50%';
                status.textContent = '⏳ Подготовка Python...';

                // Загружаем micropip (обязательно для 0.27+)
                await pyodide.loadPackage('micropip');

                // Создаём простую функцию поиска ФИО в Python
                // Мы избегаем сложных regex в Python, чтобы не было проблем с кавычками
                await pyodide.runPythonAsync(`
                    import re
                    
                    # Простые словари для эвристики
                    FIRST_NAMES = {
                        'иван', 'петр', 'александр', 'михаил', 'сергей', 'андрей', 
                        'алексей', 'дмитрий', 'николай', 'владимир', 'павел', 'константин',
                        'мария', 'анна', 'елена', 'ольга', 'татьяна', 'наталья', 'светлана'
                    }
                    LAST_NAMES = {
                        'иванов', 'петров', 'сидоров', 'смирнов', 'попов', 'козлов', 
                        'новиков', 'морозов', 'волков', 'соколов', 'родина', 'чикарев', 'новиков'
                    }

                    def find_names(text):
                        """Ищет последовательности слов с заглавной буквы и проверяет по словарю"""
                        entities = []
                        # Паттерн: 2 или 3 слова с заглавной буквы (русские)
                        pattern = re.compile(r'\\b([А-ЯЁ][а-яё]+(?:\\s+[А-ЯЁ][а-яё]+){1,2})\\b')
                        
                        for m in pattern.finditer(text):
                            candidate = m.group(1)
                            words = candidate.lower().split()
                            
                            # Проверяем: есть ли хоть одно слово в словарях?
                            # Это отсеивает "Город Москва" или "ООО Яндекс"
                            has_name = any(w in FIRST_NAMES or w in LAST_NAMES for w in words)
                            
                            if has_name:
                                entities.append({
                                    'text': candidate, 
                                    'type': 'PER', 
                                    'start': m.start(), 
                                    'end': m.end()
                                })
                        return entities
                `);
                
                progressBar.style.width = '100%';
                status.textContent = '✅ Готово!';
                initBtn.textContent = '✅ Загружено';
                initBtn.style.background = '#4caf50';
                textarea.disabled = false;
                runBtn.disabled = false;
                ready = true;
                
            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                initBtn.disabled = false;
                console.error(e);
            }
        }

        // === 2. Анонимизация (Гибрид JS + Python) ===
        async function anonymize() {
            const text = textarea.value.trim();
            if (!text || !ready) return;
            
            runBtn.disabled = true;
            status.textContent = '⏳ Анализ...';
            
            try {
                let allEntities = [];

                // А. Поиск ФИО через Python (умная эвристика)
                const pyNames = await pyodide.runPythonAsync(`find_names(${JSON.stringify(text)})`).then(r => r.toJs());
                allEntities = allEntities.concat(pyNames);

                // Б. Поиск остального через JS Regex (быстро и надёжно)
                
                // Организации
                const orgRe = /\b(?:ООО|ЗАО|ОАО|ПАО|ИП|АО)\s*[«"]?[А-ЯЁ][А-ЯЁа-яё\s\-\.,&«»"'#№]{2,60}[»"]?/gi;
                for (const m of text.matchAll(orgRe)) {
                    allEntities.push({ text: m[0], type: 'ОРГАНИЗАЦИЯ', start: m.index, end: m.index + m[0].length });
                }

                // Документы и прочее
                const structRules = [
                    { re: /(?:серия\s*)?\d{2}\s*\d{2}\s*(?:номер\s*)?\d{6}/gi, label: 'ПАСПОРТ' },
                    { re: /(?:ИНН\s*:?\s*)?\d{10,12}\b/gi, label: 'ИНН' },
                    { re: /(?:ОГРН[ИП]?\s*:?\s*)?\d{13,15}\b/gi, label: 'ОГРН' },
                    { re: /(?:СНИЛС\s*:?\s*)?(?:\d{3}-\d{3}-\d{3}\s?\d{2}|\d{11})\b/gi, label: 'СНИЛС' },
                    { re: /(?:ул\.|улица|пр-кт|проспект|пер\.|д\.|дом|кв\.|квартира)\s+[А-ЯЁа-яё\d\s\-\.,«»"'#№]{3,50}/gi, label: 'АДРЕС' }
                ];

                for (const rule of structRules) {
                    rule.re.lastIndex = 0;
                    for (const m of text.matchAll(rule.re)) {
                        allEntities.push({ text: m[0], type: rule.label, start: m.index, end: m.index + m[0].length });
                    }
                }

                // В. Сортировка и удаление перекрытий
                allEntities.sort((a, b) => a.start - b.start);
                const merged = [];
                for (const e of allEntities) {
                    if (!merged.length || e.start >= merged[merged.length - 1].end) {
                        merged.push(e);
                    }
                }

                // Г. Замена (с конца текста)
                let result = text;
                const labels = { PER: 'ФИО', ORG: 'ОРГАНИЗАЦИЯ' };
                
                merged.reverse().forEach(e => {
                    const label = labels[e.type] || e.type;
                    result = result.slice(0, e.start) + `[${label}]` + result.slice(e.end);
                });
                
                textarea.value = result;
                status.textContent = `✅ Готово! Заменено ${merged.length} сущностей.`;
                
            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                console.error(e);
            } finally {
                runBtn.disabled = false;
            }
        }

        initBtn.addEventListener('click', init);
        runBtn.addEventListener('click', anonymize);
    </script>
</body>
</html>
